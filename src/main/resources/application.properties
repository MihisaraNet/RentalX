spring.application.name=rentalX

# Multipart File Upload Settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Data Source & JPA (Default: H2 File/In-Memory for zero-configuration instant run)
spring.datasource.url=jdbc:h2:file:./data/rentalxdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for developer inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Security Configuration
rentalx.jwt.secret=9a6747f3b6c2e8a5b23d6a9e1c7f4b8a2e5d9c1b3f7a8e2d4c6b8a1e3f5d7c9a
rentalx.jwt.expiration-ms=86400000

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
