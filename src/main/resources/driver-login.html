<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Driver Login</title>
    <style>
        body { font-family: Arial; background: #e1f5fe; padding: 50px; text-align: center; }
        form {
            background: white; padding: 20px; border-radius: 10px;
            box-shadow: 0 0 10px #bbb; display: inline-block;
            max-width: 400px; width: 100%;
        }
        input, button {
            padding: 12px; margin: 10px 0; width: 100%;
            box-sizing: border-box;
        }
        button {
            background-color: #0288d1; color: white; border: none;
        }
        button:hover {
            background-color: #01579b;
        }
    </style>
</head>
<body>
<h1>Driver Login</h1>
<form id="driverLoginForm">
    <input type="text" id="driverId" placeholder="Driver ID" required>
    <input type="password" id="driverPassword" placeholder="Password" required>
    <button type="submit">Login</button>
</form>

<script>
    document.getElementById('driverLoginForm').addEventListener('submit', function (e) {
        e.preventDefault();

        const id = document.getElementById('driverId').value;
        const password = document.getElementById('driverPassword').value;

        fetch(`/driver/login?driverId=${id}&password=${password}`, {
            method: 'POST'
        })
            .then(res => res.json())
            .then(data => {
                if (data && data.driverId) {
                    sessionStorage.setItem("driverId", data.driverId);
                    window.location.href = "driver-dashboard.html";
                } else {
                    alert("Login failed. Invalid ID or password.");
                }
            });
    });
</script>
</body>
</html>
