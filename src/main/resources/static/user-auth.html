<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | RentalX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: hsl(220, 85%, 57%);
            --primary-hover: hsl(220, 85%, 47%);
            --bg-gradient: linear-gradient(135deg, hsl(210, 30%, 96%) 0%, hsl(220, 20%, 90%) 100%);
            --card-bg: hsla(0, 0%, 100%, 0.85);
            --text-main: hsl(222, 47%, 11%);
            --text-muted: hsl(215, 16%, 47%);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .register-wrapper {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 40px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            max-width: 460px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: var(--transition);
        }

        .register-wrapper:hover {
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            transform: translateY(-2px);
        }

        .logo-area {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-area h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.2rem;
            color: var(--primary);
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 6px;
        }

        .logo-area p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 0.9rem;
            color: hsl(222, 20%, 30%);
        }

        .form-control {
            width: 100%;
            padding: 11px 16px;
            font-size: 0.95rem;
            border: 1px solid hsl(215, 20%, 85%);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.7);
            color: var(--text-main);
            transition: var(--transition);
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
            outline: none;
            background: white;
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, var(--primary) 0%, hsl(220, 80%, 50%) 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
            margin-top: 15px;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, var(--primary-hover) 0%, hsl(220, 80%, 42%) 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.25);
        }

        .links-area {
            margin-top: 20px;
            text-align: center;
        }

        .links-area a {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: var(--transition);
        }

        .links-area a:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            padding-top: 15px;
        }
    </style>
</head>
<body>
<div class="register-wrapper">
    <div class="logo-area">
        <h1>Create Account</h1>
        <p>Join RentalX to start booking rides</p>
    </div>
    <form id="registerForm">
        <div class="form-group">
            <label for="regId">User ID (Alphanumeric, Min. 4 chars)</label>
            <input type="text" id="regId" class="form-control" placeholder="Choose a unique ID" pattern="[a-zA-Z0-9]{4,}" title="Minimum 4 alphanumeric characters" required>
        </div>
        <div class="form-group">
            <label for="regName">Full Name</label>
            <input type="text" id="regName" class="form-control" placeholder="Enter your full name" required>
        </div>
        <div class="form-group">
            <label for="regEmail">Email Address</label>
            <input type="email" id="regEmail" class="form-control" placeholder="name@example.com" required>
        </div>
        <div class="form-group">
            <label for="regPhone">Phone Number (9 to 15 digits)</label>
            <input type="text" id="regPhone" class="form-control" placeholder="e.g. 0777123456" pattern="[0-9]{9,15}" title="Please enter a valid phone number containing 9 to 15 digits" required>
        </div>
        <div class="form-group">
            <label for="regPassword">Password (Minimum 6 characters)</label>
            <input type="password" id="regPassword" class="form-control" placeholder="••••••••" minlength="6" required>
        </div>
        <button type="submit" class="btn-submit">Register Account</button>
    </form>

    <div class="links-area">
        <a href="user-login.html">Already have an account? Sign In</a>
    </div>

    <div class="footer">&copy; 2026 RentalX Platform. All rights reserved.</div>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', function (e) {
        e.preventDefault();

        const user = {
            userId: document.getElementById('regId').value.trim(),
            name: document.getElementById('regName').value.trim(),
            email: document.getElementById('regEmail').value.trim(),
            phone: document.getElementById('regPhone').value.trim(),
            password: document.getElementById('regPassword').value
        };

        fetch('/user/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(user)
        })
        .then(res => {
            if (!res.ok) {
                return res.text().then(msg => { throw new Error(msg); });
            }
            return res.text();
        })
        .then(msg => {
            alert(msg || "Registered successfully!");
            document.getElementById('registerForm').reset();
            window.location.href = "user-login.html"; // Redirect to login page on success!
        })
        .catch(err => {
            console.error('Registration failed:', err);
            alert(err.message || "Registration failed. Please try again.");
        });
    });
</script>
</body>
</html>
